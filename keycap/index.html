<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Keycaps — Digital Portrait</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #08080a;
    overflow: hidden;
    touch-action: none;
    font-family: -apple-system, "SF Pro Display", "Pretendard", "Helvetica Neue", Arial, sans-serif;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: absolute; left: 0; right: 0; bottom: 6%;
    pointer-events: none; text-align: center; z-index: 2;
  }
  .caption {
    font-size: 13px; font-weight: 300; letter-spacing: 0.03em;
    color: rgba(220, 220, 228, 0.45);
  }
  .fade-in { animation: fadeIn 1.8s ease forwards; opacity: 0; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hud fade-in" style="animation-delay:.8s">
    <div class="caption">눌러보세요</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR, isMobile;
let scale = 1, originX = 0, originY = 0;
let t = 0;
let keys = [];
let ripples = [];
let sparks = [];

function rand(a, b) { return a + Math.random() * (b - a); }

const pointer = { x: -9999, y: -9999, down: false, active: false };

function resize() {
  isMobile = window.innerWidth < 640 || /Mobi|Android|iPhone/i.test(navigator.userAgent);
  DPR = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}

const design = { w: 460, h: 440 };
const layoutDef = [
  { cx: 92,  cy: 74,  w: 70, h: 70,  rot: -9,  hue: 265 },
  { cx: 190, cy: 60,  w: 64, h: 64,  rot: 6,   hue: 150 },
  { cx: 278, cy: 78,  w: 82, h: 60,  rot: -4,  hue: 350 },
  { cx: 372, cy: 62,  w: 58, h: 58,  rot: 12,  hue: 40  },
  { cx: 40,  cy: 168, w: 56, h: 90,  rot: -8,  hue: 205 },
  { cx: 132, cy: 158, w: 96, h: 66,  rot: 5,   hue: 18  },
  { cx: 248, cy: 172, w: 60, h: 60,  rot: -11, hue: 282 },
  { cx: 336, cy: 166, w: 72, h: 72,  rot: 9,   hue: 168 },
  { cx: 420, cy: 190, w: 54, h: 78,  rot: -6,  hue: 320 },
  { cx: 78,  cy: 262, w: 66, h: 66,  rot: 8,   hue: 55  },
  { cx: 176, cy: 252, w: 150,h: 56,  rot: -3,  hue: 230 },
  { cx: 320, cy: 260, w: 62, h: 62,  rot: 10,  hue: 5   },
  { cx: 400, cy: 288, w: 60, h: 60,  rot: -9,  hue: 130 },
  { cx: 44,  cy: 350, w: 60, h: 60,  rot: 7,   hue: 260 },
  { cx: 138, cy: 356, w: 70, h: 70,  rot: -5,  hue: 30  },
  { cx: 236, cy: 348, w: 58, h: 58,  rot: 11,  hue: 190 },
  { cx: 316, cy: 360, w: 88, h: 62,  rot: -7,  hue: 340 },
  { cx: 404, cy: 352, w: 56, h: 56,  rot: 6,   hue: 150 }
];

function layout() {
  const s = Math.min(W / (design.w * 1.2), H / (design.h * 1.25));
  scale = s * (isMobile ? 1.12 : 1);
  originX = W / 2 - (design.w * scale) / 2;
  originY = H / 2 - (design.h * scale) / 2 + H * 0.02;

  if (keys.length === 0) {
    keys = layoutDef.map(d => ({
      cx: d.cx, cy: d.cy, w: d.w, h: d.h, rot: d.rot * Math.PI / 180, hue: d.hue,
      phase: Math.random() * Math.PI * 2,
      pressT: 0, pressV: 0, pressTarget: 0,
      bobBoost: 0,
      wobble: 0, wobbleV: 0
    }));
    keys.sort((a, b) => a.cy - b.cy);
  }
}

function toLocal(key, wx, wy) {
  const dx = wx - key._wx, dy = wy - key._wy;
  const cos = Math.cos(-key.rot), sin = Math.sin(-key.rot);
  return { x: dx * cos - dy * sin, y: dx * sin + dy * cos };
}
function hitTest(key, wx, wy) {
  const l = toLocal(key, wx, wy);
  return Math.abs(l.x) < (key.w * scale) / 2 && Math.abs(l.y) < (key.h * scale) / 2;
}

// ---------- synthesized mechanical click ----------
let audioCtx = null, noiseBuf = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.06, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playClick(kind) {
  try {
    ensureAudio();
    const now = audioCtx.currentTime;

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = kind === 'down' ? rand(1700, 2400) : rand(2400, 3400);
    bp.Q.value = 1.3;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0, now);
    ng.gain.linearRampToValueAtTime(kind === 'down' ? 0.45 : 0.3, now + 0.002);
    ng.gain.exponentialRampToValueAtTime(0.001, now + (kind === 'down' ? 0.075 : 0.05));
    src.connect(bp); bp.connect(ng); ng.connect(audioCtx.destination);
    src.start(now); src.stop(now + 0.1);

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = kind === 'down' ? rand(120, 160) : rand(160, 210);
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0, now);
    og.gain.linearRampToValueAtTime(kind === 'down' ? 0.22 : 0.12, now + 0.004);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(og); og.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.06);
  } catch (e) { /* audio unavailable, fail silently */ }
}

// ---------- interaction ----------
function onDown(x, y) {
  setPointer(x, y);
  pointer.active = true; pointer.down = true;
  for (let i = keys.length - 1; i >= 0; i--) {
    const key = keys[i];
    if (hitTest(key, pointer.x, pointer.y)) {
      key.pressTarget = 1;
      key._active = true;
      playClick('down');
      ripples.push({ x: key._wx, y: key._wy, startT: t });
      spawnSparks(key._wx, key._wy, key.hue, 6);
      break;
    }
  }
}
function onMove(x, y) { if (pointer.down) setPointer(x, y); }
function onUp() {
  pointer.down = false; pointer.active = false;
  for (const key of keys) {
    if (!key._active) continue;
    key._active = false;
    key.pressTarget = 0;
    playClick('up');
  }
  pointer.x = -9999; pointer.y = -9999;
}
function setPointer(x, y) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = x - rect.left; pointer.y = y - rect.top;
}

function spawnSparks(x, y, hue, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    sparks.push({
      x, y, vx: Math.cos(a) * rand(0.4, 1.6), vy: Math.sin(a) * rand(0.4, 1.6) - 0.4,
      life: 1, size: rand(1, 2.4), hue
    });
  }
}

// ---------- drawing ----------
function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r);
  c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h);
  c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r);
  c.arcTo(x, y, x + r, y, r);
  c.closePath();
}

function drawKey(key) {
  const w = key.w * scale, h = key.h * scale;
  const rr = Math.min(w, h) * 0.22;
  const depth = Math.min(w, h) * 0.16;
  const press = key.pressT; // 0 = up, 1 = fully pressed
  const topOffset = -depth * (1 - press);

  const bob = Math.sin(t * 0.012 + key.phase) * 3 - key.bobBoost;
  const wob = key.wobble;

  ctx.save();
  ctx.translate(key._wx, key._wy + bob);
  ctx.rotate(key.rot + wob);

  // contact shadow
  ctx.beginPath();
  ctx.ellipse(0, h * 0.42 + depth * 0.3, w * 0.42, h * 0.16, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(0,0,0,${0.4 - press * 0.12})`;
  ctx.filter = 'blur(5px)';
  ctx.fill();
  ctx.filter = 'none';

  // underglow (peeks out more as key is pressed)
  const glowA = 0.12 + press * 0.5;
  const glow = ctx.createRadialGradient(0, h * 0.15, 2, 0, h * 0.15, w * 0.75);
  glow.addColorStop(0, `hsla(${key.hue}, 85%, 65%, ${glowA})`);
  glow.addColorStop(1, `hsla(${key.hue}, 85%, 65%, 0)`);
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.ellipse(0, h * 0.1, w * 0.85, h * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();

  // side wall (base)
  roundRectPath(ctx, -w / 2, -h / 2 + depth, w, h, rr);
  ctx.fillStyle = `hsl(${key.hue}, 26%, 16%)`;
  ctx.fill();

  // top face
  roundRectPath(ctx, -w / 2, -h / 2 + topOffset, w, h, rr);
  const topGrad = ctx.createLinearGradient(0, -h / 2 + topOffset, 0, h / 2 + topOffset);
  const l1 = 62 - press * 10, l2 = 46 - press * 8;
  topGrad.addColorStop(0, `hsl(${key.hue}, 46%, ${l1}%)`);
  topGrad.addColorStop(1, `hsl(${key.hue}, 40%, ${l2}%)`);
  ctx.fillStyle = topGrad;
  ctx.fill();

  // dished highlight
  ctx.save();
  roundRectPath(ctx, -w / 2, -h / 2 + topOffset, w, h, rr);
  ctx.clip();
  const dish = ctx.createRadialGradient(0, topOffset - h * 0.08, 2, 0, topOffset, w * 0.6);
  dish.addColorStop(0, 'rgba(255,255,255,0.32)');
  dish.addColorStop(0.6, 'rgba(255,255,255,0.04)');
  dish.addColorStop(1, 'rgba(0,0,0,0.1)');
  ctx.fillStyle = dish;
  ctx.fillRect(-w / 2, -h / 2 + topOffset, w, h);
  ctx.restore();

  ctx.lineWidth = 1.2;
  ctx.strokeStyle = `hsla(${key.hue}, 40%, 75%, 0.25)`;
  roundRectPath(ctx, -w / 2, -h / 2 + topOffset, w, h, rr);
  ctx.stroke();

  ctx.restore();
}

function draw() {
  t += 1;
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(W / 2, H * 0.42, H * 0.05, W / 2, H * 0.55, H * 0.85);
  bg.addColorStop(0, '#1a1a1e');
  bg.addColorStop(1, '#060608');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // update ripples influence on keys
  if (ripples.length > 40) ripples.splice(0, ripples.length - 40);
  for (const key of keys) key.bobBoost = 0;
  for (const r of ripples) {
    for (const key of keys) {
      const dist = Math.hypot(key._wx - r.x, key._wy - r.y) / scale;
      const speed = 320; // design px per unit time-ish
      const delay = dist / speed * 60;
      const localT = t - r.startT - delay;
      if (localT > 0 && localT < 14 && dist > 4) {
        const wave = Math.sin((localT / 14) * Math.PI) * Math.max(0, 1 - dist / 260);
        key.bobBoost += wave * 4;
      }
    }
  }
  ripples = ripples.filter(r => t - r.startT < 90);

  for (const key of keys) {
    key._wx = originX + key.cx * scale;
    key._wy = originY + key.cy * scale;

    key.pressV += (key.pressTarget - key.pressT) * (key.pressTarget > key.pressT ? 0.55 : 0.16);
    key.pressV *= 0.6;
    key.pressT += key.pressV;
    key.pressT = Math.max(0, Math.min(1, key.pressT));

    key.wobbleV += (0 - key.wobble) * 0.02;
    key.wobbleV *= 0.85;
    key.wobble += key.wobbleV;
  }

  for (const key of keys) drawKey(key);

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.vy += 0.03; s.x += s.vx; s.y += s.vy; s.life -= 0.02;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.fillStyle = `hsla(${s.hue}, 85%, 75%, ${s.life})`;
    ctx.shadowColor = `hsla(${s.hue}, 85%, 70%, 0.8)`;
    ctx.shadowBlur = 5;
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  requestAnimationFrame(draw);
}

let lastTouchActivity = -9999;
canvas.addEventListener('mousemove', e => { if (t - lastTouchActivity < 90) return; onMove(e.clientX, e.clientY); });
canvas.addEventListener('mousedown', e => { if (t - lastTouchActivity < 90) return; onDown(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (t - lastTouchActivity < 90) return; onUp(); });

let activeTouchId = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  lastTouchActivity = t;
  if (activeTouchId !== null) return;
  const touch = e.changedTouches[0];
  activeTouchId = touch.identifier;
  onDown(touch.clientX, touch.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  lastTouchActivity = t;
  for (const touch of e.changedTouches) {
    if (touch.identifier === activeTouchId) { onMove(touch.clientX, touch.clientY); break; }
  }
}, { passive: false });
function endTouch(e) {
  e.preventDefault();
  lastTouchActivity = t;
  for (const touch of e.changedTouches) {
    if (touch.identifier === activeTouchId) { activeTouchId = null; onUp(); break; }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>
